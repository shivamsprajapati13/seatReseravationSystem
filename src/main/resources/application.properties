spring.application.name=seat-reservation

# Railway sets PORT; local default 8600
server.port=${PORT:8600}
server.address=0.0.0.0

# --- Database ---
# Local: defaults below (localhost / seats / root).
# Railway: link MySQL service variables (MYSQLHOST, MYSQLPORT, MYSQLUSER, MYSQLPASSWORD, MYSQLDATABASE)
#   or set SPRING_DATASOURCE_URL + SPRING_DATASOURCE_USERNAME + SPRING_DATASOURCE_PASSWORD in the service env.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:seats}?useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# No Flyway dependency in build — schema via Hibernate ddl-auto on deploy
spring.flyway.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.status.http-mapping.down=503

# Health probes: liveness vs readiness (readiness fails closed when DB is down)
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=false

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-components=never

management.endpoint.health.group.readiness.include=readinessState,database
management.endpoint.health.group.readiness.show-components=never

# Metrics (Prometheus at /actuator/prometheus)
management.metrics.tags.application=seat-reservation
management.prometheus.metrics.export.enabled=true

# Admin (POST /shows) — set APP_ADMIN_TOKEN in Railway (required for production)
app.admin-token=${APP_ADMIN_TOKEN:admin-secret}
