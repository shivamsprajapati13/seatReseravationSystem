spring.application.name=seat-reservation

# Railway sets PORT; local default 8600
server.port=${PORT:8600}
server.address=0.0.0.0

# --- Database (local defaults; Railway overrides via MYSQL_URL / MYSQLHOST — see RailwayDataSourceEnvironmentPostProcessor) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:seats}?useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}

# Required when JDBC is not reachable during Hibernate bootstrap (Railway cold start / URL misconfig)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

spring.flyway.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.status.http-mapping.down=503

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=false

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-components=never

management.endpoint.health.group.readiness.include=readinessState,database
management.endpoint.health.group.readiness.show-components=never

management.metrics.tags.application=seat-reservation
management.prometheus.metrics.export.enabled=true

app.admin-token=${APP_ADMIN_TOKEN:admin-secret}
