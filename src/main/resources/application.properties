spring.application.name=seat-reservation

server.port=${PORT:8600}
server.address=0.0.0.0

# --- Database (use MYSQL* env vars on Railway — do NOT set SPRING_DATASOURCE_USERNAME; it often becomes "spring") ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Binds to SPRING_DATASOURCE_URL, or constructs from individual Railway variables, or defaults to localhost
spring.datasource.url=jdbc:mysql://root:MvMcVwSauZBRhZPwvwTbhbHNJwtxQzyM@mysql.railway.internal:3306/seats
spring.datasource.username=root
spring.datasource.password=MvMcVwSauZBRhZPwvwTbhbHNJwtxQzyM

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.status.http-mapping.down=503

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=false

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-components=never

management.endpoint.health.group.readiness.include=readinessState,database
management.endpoint.health.group.readiness.show-components=never

management.metrics.tags.application=seat-reservation
management.prometheus.metrics.export.enabled=true

app.admin-token=${APP_ADMIN_TOKEN:admin-secret}
