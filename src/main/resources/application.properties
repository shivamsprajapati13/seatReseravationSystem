spring.application.name=seat-reservation

server.port=${PORT:8600}
server.address=0.0.0.0

# --- Database ---
# Local: defaults (localhost / seats / root).
# Railway: on the API service, add variable REFERENCES from MySQL → MYSQLHOST, MYSQLPORT,
#   MYSQLUSER, MYSQLPASSWORD, MYSQLDATABASE (resolved values, not ${{...}} templates).
# Optional full override: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=${MYSQL_USE_SSL}&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=30000&socketTimeout=30000}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.status.http-mapping.down=503

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=false

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-components=never

management.endpoint.health.group.readiness.include=readinessState,database
management.endpoint.health.group.readiness.show-components=never

management.metrics.tags.application=seat-reservation
management.prometheus.metrics.export.enabled=true

app.admin-token=${APP_ADMIN_TOKEN:admin-secret}
