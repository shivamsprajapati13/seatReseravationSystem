spring.application.name=demo
server.port=8600

spring.datasource.url=jdbc:mysql://localhost:3306/seats?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.status.http-mapping.down=503

# Health probes: liveness vs readiness (readiness fails closed when DB is down)
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=false

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-components=never

management.endpoint.health.group.readiness.include=readinessState,database
management.endpoint.health.group.readiness.show-components=never

# Metrics (Prometheus at /actuator/prometheus)
management.metrics.tags.application=seat-reservation
management.prometheus.metrics.export.enabled=true

# Admin (POST /shows)
app.admin-token=admin-secret