spring.application.name=seat-reservation

server.port=${PORT:8600}
server.address=0.0.0.0

# --- Database ---
# Railway (app service): reference from MySQL → MYSQL_URL (easiest) OR MYSQLHOST + MYSQLPORT + MYSQLUSER + MYSQLPASSWORD + MYSQLDATABASE
# IMPORTANT: private MYSQLPORT is often NOT 3306 (e.g. 45487) — always reference MYSQLPORT from MySQL, never hardcode.
# Do NOT set SPRING_DATASOURCE_USERNAME on Railway (often becomes "spring").
# Never commit real passwords in this file — use Railway variables only.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=30000&socketTimeout=30000
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Force connection retries during the application boot process
spring.datasource.hikari.initialization-fail-timeout=30000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.status.http-mapping.down=503

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=false

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-components=never

management.endpoint.health.group.readiness.include=readinessState,database
management.endpoint.health.group.readiness.show-components=never

management.metrics.tags.application=seat-reservation
management.prometheus.metrics.export.enabled=true

app.admin-token=${APP_ADMIN_TOKEN:admin-secret}
